<script type="text/javascript">
	let option{=bannerCode} = {
		slidesPerView: 1,
		loop: true,
		<!--{ ? bannerTime == 'manual' }-->
		autoplay: false,
		<!--{ : }-->
		autoplay:{
			  delay: {=bannerSliderTime},
			  disableOnInteraction: false,
		},
		<!--{ / }-->
		<!--{ ? bannerPageButton['useFl'] == 'c' }-->
		pagination : {
			el: '.swiper-banner-{=bannerCode} .custom-swiper-pagination',
			clickable: true,
			renderBullet: function (index, className) {
				return '<li class="pagination-num' + index + ' ' + className + '"><button type="button" data-role="none" role="button">button</button></li>';
			},
		},
		on : {
			init : function() {
				var navWidth, navHeight, defaultNavCSS, defaultNavBtnCSS, activeNavCSS, activeNavBtnCSS;
				var navFontStyle = "font-size:0 !important;";
				<!--{ @ bannerImgInfo }-->
				<!--{ ? .value_['act'] }-->
				navWidth = "width: {=.value_['act']['width']}px !important;";
				navHeight = "height: {=.value_['act']['height']}px !important;";
				activeNavCSS = ".swiper-banner-{=bannerCode} .custom-swiper-pagination li.swiper-pagination-bullet-active.pagination-num" + {=sprintf('%d', .key_)} + " \{" + navWidth + navHeight + "\}";
				activeNavBtnCSS = ".swiper-banner-{=bannerCode} .custom-swiper-pagination li.swiper-pagination-bullet-active.pagination-num" + {=sprintf('%d', .key_)} + " button {" + navWidth + navHeight + navFontStyle + "background: url({=.value_['act']['img']}) no-repeat !important;}";
				console.log({=sprintf('%d', .key_)});
				<!--{ / }-->
				<!--{ ? .value_['inact']}-->
				$(".swiper-banner-{=bannerCode} .custom-swiper-pagination li.pagination-num" + {=sprintf('%d', .key_)}).addClass('default-slick-banner');
				navWidth = "width: {=.value_['inact']['width']}px;";
				navHeight = "height: {=.value_['inact']['height']}px;";
				defaultNavCSS = ".swiper-banner-{=bannerCode} .custom-swiper-pagination li.pagination-num" + {=sprintf('%d', .key_)} + ":not(.swiper-pagination-bullet-active) \{" + navWidth + navHeight + "\}";
				defaultNavBtnCSS = ".swiper-banner-{=bannerCode} .custom-swiper-pagination li.pagination-num" + {=sprintf('%d', .key_)} + ":not(.swiper-pagination-bullet-active) button {" + navWidth + navHeight + navFontStyle + "background: url({=.value_['inact']['img']}) no-repeat;}";
				<!--{ / }-->
				$('.swiper-banner-{=bannerCode}').siblings('style').append(defaultNavCSS + '\n' + defaultNavBtnCSS + '\n' + activeNavCSS + '\n' + activeNavBtnCSS);
				<!--{ / }-->
			}
		},
		<!--{ : bannerPageButton['useFl'] != 'n' }-->
		pagination : {
			el: '.swiper-banner-{=bannerCode} .swiper-pagination',
			clickable: true,
		},
		<!--{ / }-->
		<!--{ ? bannerSideButton['useFl'] !== 'n' }-->
		navigation: {
			nextEl: ".swiper-banner-{=bannerCode} .swiper-button-next",
			prevEl: ".swiper-banner-{=bannerCode} .swiper-button-prev",
		},
		<!--{ / }-->
		<!--{ ? bannerEffect === 'fade' }-->
		effect: "fade",
		<!--{ / }-->
		speed: {=bannerSpeed},
		loopAdditionalSlides : 1,
	}

	const swiper{=bannerCode} = new Swiper(".swiper-banner-{=bannerCode}", option{=bannerCode});
</script>
