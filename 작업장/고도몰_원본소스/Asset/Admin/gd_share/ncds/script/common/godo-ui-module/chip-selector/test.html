<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChipSelector Test</title>
    <style>
        /* CSS Variables */
        :root {
            --gray-50: #fafafa;
            --gray-200: #e0e0e0;
            --gray-300: #d0d0d0;
            --gray-400: #999;
            --gray-500: #767676;
            --base-white: #fff;
            --primary-500: #007bff;
            --font-size-xs: 12px;
            --font-size-sm: 13px;
            --font-weights-commerce-sans-1: 600;
            --font-weights-commerce-sans-2: 500;
            --line-heights-xs: 1.4;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f8f9fa;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .panel h2 {
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #007bff;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: #007bff;
            color: white;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
            margin-left: 10px;
        }

        .btn-secondary:hover {
            background-color: #545b62;
        }

        .log-area {
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .log-item {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            padding: 5px;
            border-bottom: 1px solid #e0e0e0;
            color: #333;
        }

        .log-item:last-child {
            border-bottom: none;
        }

        .log-item .time {
            color: #999;
            margin-right: 10px;
        }

        .log-item .event {
            color: #007bff;
            font-weight: 600;
            margin-right: 10px;
        }

        /* ChipSelector 스타일 */
        .ncua-card__body-block-section {
            margin-bottom: 20px;
        }

        .ncua-card__body-title--xs {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #333;
        }

        .chip-selector {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ncua-select {
            position: relative;
        }

        .ncua-select--xs {
            width: 100%;
        }

        .ncua-select__content {
            position: relative;
        }

        .ncua-select__tag {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            background-color: white;
            cursor: pointer;
        }

        .ncua-select__tag:focus {
            outline: none;
            border-color: #007bff;
        }

        .chip-button-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip-button {
            padding: 6px 12px;
            border: 1px solid #007bff;
            background-color: white;
            color: #007bff;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .chip-button:hover {
            background-color: #007bff;
            color: white;
        }

        .chip-button:active {
            transform: scale(0.95);
        }

        .chip-button-text {
            display: inline-block;
        }

        /* 안내 텍스트 스타일 */
        .replace-code-caution {
            list-style: none;
            padding: 0;
            margin: 10px 0;
        }

        .ncua-caution-text {
            font-size: 12px;
            color: #dc3545;
            padding: 4px 0;
            line-height: 1.5;
        }

        .ncua-caution-text::before {
            content: '• ';
            margin-right: 4px;
        }

        #log-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #007bff;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
        }

        .info-box p {
            margin: 0;
            font-size: 13px;
            color: #333;
        }

        /* Textarea 영역 스타일 */
        .textarea-section {
            margin-bottom: 20px;
        }

        .textarea-section label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        #message-textarea {
            width: 100%;
            min-height: 150px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: 'Noto Sans KR', Arial, sans-serif;
            line-height: 1.6;
            resize: vertical;
            transition: border-color 0.2s;
        }

        #message-textarea:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        .textarea-info {
            margin-top: 8px;
            font-size: 12px;
            color: #666;
            display: flex;
            justify-content: space-between;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-group button {
            flex: 1;
        }

        .preview-box {
            background: #f8f9fa;
            border: 2px dashed #007bff;
            border-radius: 4px;
            padding: 15px;
            margin-top: 10px;
            white-space: pre-wrap;
            word-break: break-word;
            min-height: 50px;
            font-size: 14px;
            line-height: 1.6;
        }

        .preview-box:empty::before {
            content: '미리보기가 여기에 표시됩니다.';
            color: #999;
        }
    </style>
</head>
<body>
    <h1>🧪 ChipSelector Component Test</h1>

    <div class="info-box">
        <p><strong>테스트 방법:</strong> 아래 텍스트 영역에 커서를 놓고, 카테고리를 선택한 후 칩 버튼을 클릭하면 변수가 커서 위치에 삽입됩니다.</p>
    </div>

    <!-- 메시지 작성 영역 -->
    <div class="panel" style="margin-bottom: 20px;">
        <h2>✍️ 메시지 작성</h2>
        <div class="textarea-section">
            <label for="message-textarea">메시지 내용 (칩 버튼 클릭 시 변수가 삽입됩니다)</label>
            <textarea id="message-textarea" placeholder="여기에 메시지를 작성하세요. 칩 버튼을 클릭하면 커서 위치에 변수가 삽입됩니다.

예시:
안녕하세요 #{회원명}님!
주문번호 #{주문번호}가 정상적으로 처리되었습니다."></textarea>
            <div class="textarea-info">
                <span>현재 글자수: <strong id="char-count">0</strong>자</span>
                <span>커서 위치: <strong id="cursor-position">0</strong></span>
            </div>
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="clearTextarea()">내용 초기화</button>
                <button class="btn btn-primary" onclick="showPreview()">미리보기</button>
            </div>
            <div id="preview-box" class="preview-box" style="display: none;"></div>
        </div>
    </div>

    <div class="container">
        <!-- 왼쪽: ChipSelector 렌더링 영역 -->
        <div class="panel">
            <h2>📱 ChipSelector Preview</h2>
            <div id="chip-selector-container"></div>
        </div>

        <!-- 오른쪽: 컨트롤 패널 -->
        <div class="panel">
            <h2>⚙️ 컨트롤 패널</h2>

            <div class="form-group">
                <label>변수 추가 (현재 카테고리)</label>
                <input type="text" id="newVariableKey" placeholder="변수 키 (예: #{회원명})">
                <input type="text" id="newVariableLabel" placeholder="변수 라벨 (예: 회원이름)" style="margin-top: 5px;">
            </div>

            <button class="btn btn-primary" onclick="addVariable()">변수 추가</button>
            <button class="btn btn-secondary" onclick="clearLog()">로그 초기화</button>

            <hr style="margin: 20px 0; border: 1px solid #e0e0e0;">

            <div class="form-group">
                <label>제목 변경</label>
                <input type="text" id="titleInput" value="치환코드" placeholder="제목">
                <button class="btn btn-primary" onclick="updateTitle()" style="margin-top: 5px; width: 100%;">제목 변경</button>
            </div>

            <div class="form-group">
                <label>API 테스트</label>
                <button class="btn btn-primary" onclick="testGetSelectedCategory()" style="width: 100%; margin-bottom: 5px;">getSelectedCategory()</button>
                <button class="btn btn-primary" onclick="testRefresh()" style="width: 100%;">refresh()</button>
            </div>

            <hr style="margin: 20px 0; border: 1px solid #e0e0e0;">

            <div class="form-group">
                <label>안내 텍스트 설정</label>
                <button class="btn btn-success" onclick="updateCautionHTML()" style="width: 100%; margin-bottom: 5px;">setCautionHTML() - 텍스트 변경</button>
                <button class="btn btn-warning" onclick="removeCautionHTML()" style="width: 100%;">setCautionHTML(null) - 텍스트 제거</button>
            </div>

            <h2 style="margin-top: 30px;">📋 이벤트 로그</h2>
            <div class="log-area">
                <ul id="log-list"></ul>
            </div>
        </div>
    </div>

    <!-- ChipSelector 스크립트 로드 -->
    <script src="../godo-ui-module.js"></script>
    <script src="./chip-selector.js"></script>

    <script>
        // 샘플 카테고리 데이터
        let categoriesData = [
            {
                value: 'member',
                label: '회원정보',
                variables: [
                    { key: '#{회원명}', label: '회원이름' },
                    { key: '#{회원아이디}', label: '아이디' },
                    { key: '#{이메일}', label: '이메일' },
                    { key: '#{휴대폰번호}', label: '휴대폰' },
                    { key: '#{등급명}', label: '회원등급' }
                ]
            },
            {
                value: 'order',
                label: '주문정보',
                variables: [
                    { key: '#{주문번호}', label: '주문번호' },
                    { key: '#{주문일시}', label: '주문일시' },
                    { key: '#{주문상품}', label: '주문상품명' },
                    { key: '#{주문금액}', label: '주문금액' },
                    { key: '#{배송상태}', label: '배송상태' }
                ]
            },
            {
                value: 'product',
                label: '상품정보',
                variables: [
                    { key: '#{상품명}', label: '상품명' },
                    { key: '#{상품가격}', label: '상품가격' },
                    { key: '#{할인가}', label: '할인가격' },
                    { key: '#{재고수량}', label: '재고' },
                    { key: '#{브랜드명}', label: '브랜드' }
                ]
            },
            {
                value: 'coupon',
                label: '쿠폰정보',
                variables: [
                    { key: '#{쿠폰명}', label: '쿠폰명' },
                    { key: '#{할인금액}', label: '할인금액' },
                    { key: '#{유효기간}', label: '유효기간' },
                    { key: '#{사용조건}', label: '사용조건' }
                ]
            },
            {
                value: 'shop',
                label: '쇼핑몰정보',
                variables: [
                    { key: '#{쇼핑몰명}', label: '쇼핑몰명' },
                    { key: '#{대표전화}', label: '대표전화' },
                    { key: '#{고객센터}', label: '고객센터' },
                    { key: '#{URL}', label: '홈페이지' }
                ]
            }
        ];

        // ChipSelector 인스턴스
        let chipSelector = null;
        
        // Textarea 요소
        let textarea = null;

        // 초기화
        function init() {
            try {
                textarea = document.getElementById('message-textarea');
                
                // textarea 이벤트 리스너
                textarea.addEventListener('input', updateTextareaInfo);
                textarea.addEventListener('click', updateTextareaInfo);
                textarea.addEventListener('keyup', updateTextareaInfo);

                // GodoUIModule.render()를 사용한 ChipSelector 생성
                chipSelector = GodoUIModule.render({
                    type: 'ChipSelector',
                    target: '#chip-selector-container',
                    title: '치환코드',
                    tooltipSeq: null,
                    cautionHTML: `
                        <ul class="replace-code-caution">
                            <li class="ncua-caution-text">회원 외 치환코드는 정상 적용되지 않으니 저장된 메시지 수정 시에만 이용바랍니다.</li>
                            <li class="ncua-caution-text">템플릿 사용시에 미지원 치환코드가 포함된 경우, 해당 값은 공란으로 발송되므로 미리보기를 확인해주시기 바랍니다.</li>
                        </ul>
                    `,
                    categories: categoriesData,
                    onSelect: function(variable, button) {
                        insertVariableToTextarea(variable);
                        addLog('onSelect', `선택된 변수: ${variable}`);
                        console.log('Selected variable:', variable, button);
                    },
                    onCategoryChange: function(categoryValue) {
                        const category = categoriesData.find(c => c.value === categoryValue);
                        const categoryLabel = category?.label || categoryValue;
                        addLog('onCategoryChange', `카테고리 변경: ${categoryLabel} (${categoryValue})`);
                        console.log('Category changed:', categoryValue);
                        
                        // 특정 카테고리일 때 추가 액션 예시
                        if (categoryValue === 'order') {
                            console.log('주문정보 카테고리 선택됨 - 특별 액션 실행 가능');
                        }
                    }
                });

                addLog('init', 'ChipSelector 초기화 완료 (GodoUIModule 사용)');
                updateTextareaInfo();
            } catch (error) {
                console.error('초기화 오류:', error);
                addLog('error', error.message);
            }
        }

        // Textarea에 변수 삽입
        function insertVariableToTextarea(variable) {
            if (!textarea) return;

            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const text = textarea.value;

            // 커서 위치에 변수 삽입
            const newText = text.substring(0, start) + variable + text.substring(end);
            textarea.value = newText;

            // 커서를 삽입된 변수 뒤로 이동
            const newCursorPos = start + variable.length;
            textarea.setSelectionRange(newCursorPos, newCursorPos);

            // textarea에 포커스
            textarea.focus();

            // 정보 업데이트
            updateTextareaInfo();

            addLog('insert', `"${variable}" 변수가 위치 ${start}에 삽입됨`);
        }

        // Textarea 정보 업데이트
        function updateTextareaInfo() {
            if (!textarea) return;

            const charCount = textarea.value.length;
            const cursorPos = textarea.selectionStart;

            document.getElementById('char-count').textContent = charCount;
            document.getElementById('cursor-position').textContent = cursorPos;
        }

        // Textarea 초기화
        function clearTextarea() {
            if (!textarea) return;
            
            if (textarea.value && !confirm('작성한 내용을 모두 지우시겠습니까?')) {
                return;
            }

            textarea.value = '';
            updateTextareaInfo();
            document.getElementById('preview-box').style.display = 'none';
            addLog('clear', 'Textarea 내용 초기화');
        }

        // 미리보기 표시
        function showPreview() {
            if (!textarea) return;

            const previewBox = document.getElementById('preview-box');
            const content = textarea.value;

            if (!content.trim()) {
                alert('메시지 내용을 입력해주세요.');
                return;
            }

            previewBox.textContent = content;
            previewBox.style.display = 'block';
            addLog('preview', '미리보기 표시');
        }

        // 로그 추가
        function addLog(event, message) {
            const logList = document.getElementById('log-list');
            const logItem = document.createElement('li');
            logItem.className = 'log-item';
            
            const now = new Date();
            const timeStr = now.toLocaleTimeString('ko-KR');
            
            logItem.innerHTML = `
                <span class="time">[${timeStr}]</span>
                <span class="event">${event}</span>
                <span class="message">${message}</span>
            `;
            
            logList.insertBefore(logItem, logList.firstChild);
            
            // 로그가 너무 많으면 오래된 것 삭제 (최대 50개)
            if (logList.children.length > 50) {
                logList.removeChild(logList.lastChild);
            }
        }

        // 로그 초기화
        function clearLog() {
            document.getElementById('log-list').innerHTML = '';
            addLog('clear', '로그가 초기화되었습니다.');
        }

        // 변수 추가
        function addVariable() {
            const key = document.getElementById('newVariableKey').value.trim();
            const label = document.getElementById('newVariableLabel').value.trim();

            if (!key || !label) {
                alert('변수 키와 라벨을 모두 입력해주세요.');
                return;
            }

            const currentCategory = chipSelector.getSelectedCategory();
            const category = categoriesData.find(c => c.value === currentCategory);

            if (category) {
                category.variables.push({ key, label });
                chipSelector.setCategories(categoriesData);
                addLog('addVariable', `변수 추가: ${key} ${label}`);
                
                // 입력 필드 초기화
                document.getElementById('newVariableKey').value = '';
                document.getElementById('newVariableLabel').value = '';
            }
        }

        // 제목 변경
        function updateTitle() {
            const newTitle = document.getElementById('titleInput').value.trim();
            if (!newTitle) {
                alert('제목을 입력해주세요.');
                return;
            }

            chipSelector.title = newTitle;
            chipSelector.render();
            addLog('updateTitle', `제목 변경: ${newTitle}`);
        }

        // API 테스트: getSelectedCategory
        function testGetSelectedCategory() {
            const category = chipSelector.getSelectedCategory();
            const categoryLabel = categoriesData.find(c => c.value === category)?.label || category;
            addLog('API', `getSelectedCategory() = "${category}" (${categoryLabel})`);
            alert(`현재 선택된 카테고리: ${categoryLabel} (${category})`);
        }

        // API 테스트: refresh
        function testRefresh() {
            chipSelector.refresh();
            addLog('API', 'refresh() 호출 - 칩 버튼 새로고침');
        }

        // 안내 텍스트 변경
        function updateCautionHTML() {
            const newCautionHTML = `
                <ul class="replace-code-caution">
                    <li class="ncua-caution-text">⚠️ 새로운 안내 텍스트가 설정되었습니다.</li>
                    <li class="ncua-caution-text">✅ setCautionHTML() 메서드를 사용하여 동적으로 변경할 수 있습니다.</li>
                </ul>
            `;
            
            chipSelector.setCautionHTML(newCautionHTML);
            addLog('setCautionHTML', '안내 텍스트가 변경되었습니다.');
        }

        // 안내 텍스트 제거
        function removeCautionHTML() {
            chipSelector.setCautionHTML(null);
            addLog('setCautionHTML', '안내 텍스트가 제거되었습니다.');
        }

        // 페이지 로드 시 초기화
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
