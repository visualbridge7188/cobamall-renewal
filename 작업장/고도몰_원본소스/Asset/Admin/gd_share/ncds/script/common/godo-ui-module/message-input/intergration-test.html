<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MessageInput + ChipSelector + CrmPreview Integration</title>
    
    <!-- CrmPreview CSS -->
    <link rel="stylesheet" href="../../../css/crm/layer-preview.css">
    
    <style>
        /* CSS Variables */
        :root {
            --gray-50: #fafafa;
            --gray-200: #e0e0e0;
            --gray-300: #d0d0d0;
            --gray-400: #999;
            --gray-500: #767676;
            --base-white: #fff;
            --primary-500: #007bff;
            --font-size-xs: 12px;
            --font-size-sm: 13px;
            --font-weights-commerce-sans-1: 600;
            --font-weights-commerce-sans-2: 500;
            --line-heights-xs: 1.4;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f8f9fa;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr 400px;
            gap: 20px;
        }

        .panel {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .panel h2 {
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #007bff;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            margin-right: 5px;
            margin-bottom: 5px;
        }

        .btn-primary {
            background-color: #007bff;
            color: white;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #545b62;
        }

        .btn-success {
            background-color: #28a745;
            color: white;
        }

        .btn-success:hover {
            background-color: #218838;
        }

        .btn-warning {
            background-color: #ffc107;
            color: #333;
        }

        .btn-warning:hover {
            background-color: #e0a800;
        }

        .log-area {
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            max-height: 250px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .log-item {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            padding: 4px;
            border-bottom: 1px solid #e0e0e0;
            color: #333;
        }

        .log-item:last-child {
            border-bottom: none;
        }

        .log-item .time {
            color: #999;
            margin-right: 8px;
        }

        .log-item .event {
            color: #007bff;
            font-weight: 600;
            margin-right: 8px;
        }

        #log-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #007bff;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
        }

        .info-box p {
            margin: 0;
            font-size: 13px;
            color: #333;
        }

        /* MessageInput 스타일 */
        .ncua-input {
            position: relative;
        }

        .ncua-input--textarea {
            width: 100%;
        }

        .ncua-input__textarea {
            width: 100%;
            min-height: 180px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: 'Noto Sans KR', Arial, sans-serif;
            line-height: 1.6;
            resize: vertical;
            transition: border-color 0.2s;
        }

        .ncua-input__textarea:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        .ncua-input__text-count-wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            padding: 0 4px;
        }

        .ncua-hint-text {
            font-size: 12px;
            color: #dc3545;
        }

        .ncua-input__text-count {
            font-size: 13px;
            color: #666;
        }

        .ncua-input__text-count-text {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .ncua-input__text-count-text-count {
            font-weight: 600;
            color: #007bff;
        }

        .ncua-input__text-count-text-max {
            font-weight: 600;
        }

        .btn-group {
            margin-top: 10px;
        }

        /* ChipSelector 스타일 */
        .ncua-card__body-block-section {
            margin-bottom: 20px;
        }

        .ncua-card__body-title--xs {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #333;
        }

        .chip-selector {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ncua-select {
            position: relative;
        }

        .ncua-select--xs {
            width: 100%;
        }

        .ncua-select__content {
            position: relative;
        }

        .ncua-select__tag {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            background-color: white;
            cursor: pointer;
        }

        .ncua-select__tag:focus {
            outline: none;
            border-color: #007bff;
        }

        .chip-button-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip-button {
            padding: 6px 12px;
            border: 1px solid #007bff;
            background-color: white;
            color: #007bff;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .chip-button:hover {
            background-color: #007bff;
            color: white;
        }

        .chip-button:active {
            transform: scale(0.95);
        }

        .chip-button-text {
            display: inline-block;
        }

        /* Preview Panel */
        .preview-panel {
            position: sticky;
            top: 20px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>🧪 Complete Integration: MessageInput + ChipSelector + CrmPreview</h1>

    <div class="info-box">
        <p><strong>완전 통합 테스트:</strong> MessageInput에 입력하면 실시간으로 CrmPreview가 업데이트됩니다. ChipSelector로 변수를 선택하면 자동 삽입되고 미리보기도 즉시 반영됩니다.</p>
    </div>

    <div class="container">
        <!-- 왼쪽: MessageInput + ChipSelector -->
        <div>
            <div class="panel" style="margin-bottom: 20px;">
                <h2>✍️ 메시지 작성 (MessageInput)</h2>
                <div id="message-input-container"></div>
            </div>

            <div class="panel">
                <h2>🏷️ 변수 선택 (ChipSelector)</h2>
                <div id="chip-selector-container"></div>
            </div>
        </div>

        <!-- 중간: 컨트롤 패널 -->
        <div class="panel">
            <h2>⚙️ 컨트롤 패널</h2>

            <div class="form-group">
                <label>메시지 템플릿</label>
                <select id="templateSelect" onchange="applyTemplate()">
                    <option value="">템플릿 선택</option>
                    <option value="welcome">환영 메시지</option>
                    <option value="order">주문 확인</option>
                    <option value="shipping">배송 안내</option>
                    <option value="coupon">쿠폰 발급</option>
                </select>
            </div>

            <hr style="margin: 15px 0; border: 1px solid #e0e0e0;">

            <div class="form-group">
                <label>발송 유형</label>
                <select id="sendTypeSelect" onchange="changeSendType()">
                    <option value="SMS">SMS</option>
                    <option value="LMS">LMS (긴 문자)</option>
                    <option value="NORMAL">일반 메시지</option>
                </select>
            </div>

            <hr style="margin: 15px 0; border: 1px solid #e0e0e0;">

            <div class="form-group">
                <label>setValue 테스트</label>
                <textarea id="setValueInput" rows="3" placeholder="여기에 입력한 내용을 setValue()로 적용합니다."></textarea>
                <button class="btn btn-primary" onclick="testSetValue()" style="width: 100%; margin-top: 5px;">setValue() 실행</button>
            </div>

            <hr style="margin: 15px 0; border: 1px solid #e0e0e0;">

            <div class="form-group">
                <label>기타 API</label>
                <button class="btn btn-secondary" onclick="testGetValue()" style="width: 100%; margin-bottom: 5px;">getValue()</button>
                <button class="btn btn-secondary" onclick="testClear()" style="width: 100%;">clear()</button>
            </div>

            <hr style="margin: 15px 0; border: 1px solid #e0e0e0;">

            <button class="btn btn-secondary" onclick="clearLog()" style="width: 100%;">로그 초기화</button>

            <h2 style="margin-top: 20px;">📋 이벤트 로그</h2>
            <div class="log-area">
                <ul id="log-list"></ul>
            </div>
        </div>

        <!-- 오른쪽: CrmPreview -->
        <div class="panel preview-panel">
            <h2>📱 실시간 미리보기 (CrmPreview)</h2>
            <div id="preview-container"></div>
        </div>
    </div>

    <!-- 스크립트 로드 -->
    <script src="../chip-selector/chip-selector.js"></script>
    <script src="./message-input.js"></script>
    <script src="../crm-preview/crm-preview-loader.js"></script>
    <script src="../godo-ui-module.js"></script>

    <script>
        // 인스턴스
        let messageInput = null;
        let chipSelector = null;
        let crmPreview = null;

        // 샘플 카테고리 데이터
        const categoriesData = [
            {
                value: 'member',
                label: '회원정보',
                variables: [
                    { key: '#{회원명}', label: '회원이름' },
                    { key: '#{회원아이디}', label: '아이디' },
                    { key: '#{이메일}', label: '이메일' },
                    { key: '#{휴대폰번호}', label: '휴대폰' },
                    { key: '#{등급명}', label: '회원등급' }
                ]
            },
            {
                value: 'order',
                label: '주문정보',
                variables: [
                    { key: '#{주문번호}', label: '주문번호' },
                    { key: '#{주문일시}', label: '주문일시' },
                    { key: '#{주문상품}', label: '주문상품명' },
                    { key: '#{주문금액}', label: '주문금액' },
                    { key: '#{배송상태}', label: '배송상태' }
                ]
            },
            {
                value: 'product',
                label: '상품정보',
                variables: [
                    { key: '#{상품명}', label: '상품명' },
                    { key: '#{상품가격}', label: '상품가격' },
                    { key: '#{할인가}', label: '할인가격' },
                    { key: '#{재고수량}', label: '재고' },
                    { key: '#{브랜드명}', label: '브랜드' }
                ]
            },
            {
                value: 'coupon',
                label: '쿠폰정보',
                variables: [
                    { key: '#{쿠폰명}', label: '쿠폰명' },
                    { key: '#{할인금액}', label: '할인금액' },
                    { key: '#{유효기간}', label: '유효기간' },
                    { key: '#{사용조건}', label: '사용조건' }
                ]
            },
            {
                value: 'shop',
                label: '쇼핑몰정보',
                variables: [
                    { key: '#{쇼핑몰명}', label: '쇼핑몰명' },
                    { key: '#{대표전화}', label: '대표전화' },
                    { key: '#{고객센터}', label: '고객센터' },
                    { key: '#{URL}', label: '홈페이지' }
                ]
            }
        ];

        // 메시지 템플릿
        const templates = {
            welcome: '안녕하세요 #{회원명}님!\n#{쇼핑몰명}에 가입해 주셔서 감사합니다.\n다양한 상품을 둘러보세요!',
            order: '#{회원명}님의 주문이 완료되었습니다.\n주문번호: #{주문번호}\n주문금액: #{주문금액}\n감사합니다.',
            shipping: '#{회원명}님, 주문하신 상품이 배송 중입니다.\n주문번호: #{주문번호}\n배송상태: #{배송상태}\n곧 받아보실 수 있습니다!',
            coupon: '#{회원명}님께 특별한 쿠폰을 드립니다!\n쿠폰명: #{쿠폰명}\n할인금액: #{할인금액}\n유효기간: #{유효기간}\n지금 바로 사용하세요!'
        };

        // 초기화
        function init() {
            try {
                // 1. CrmPreview 먼저 생성
                crmPreview = GodoUIModule.render({
                    type: 'MessagePreview',
                    target: '#preview-container',
                    messageType: 'SMS',
                    noticeText: '미리보기와 실제가 다를 수 있습니다.',
                    checkboxText: '변수로 변환해서 보기'
                });

                // 초기 content 설정
                crmPreview.setContent('안녕하세요 #{회원명}님!\n주문번호 #{주문번호}가 처리되었습니다.');

                // 2. MessageInput 생성 - onInput에서 CrmPreview 연동
                messageInput = GodoUIModule.render({
                    type: 'MessageInput',
                    target: '#message-input-container',
                    name: 'testMessage',
                    placeholder: '메시지를 입력하세요. 입력 내용이 실시간으로 미리보기에 반영됩니다.',
                    hintText: 'SMS는 90 bytes 이하 권장, 최대 2000 bytes',
                    maxLength: 2000,
                    useBytes: true,
                    bytesThreshold: 90,
                    initialValue: '안녕하세요 #{회원명}님!\n주문번호 #{주문번호}가 처리되었습니다.',
                    onInput: function(value, event) {
                        // 입력될 때마다 CrmPreview 업데이트
                        crmPreview.setContent(value);
                        
                        addLog('MessageInput → Preview', `입력 → 미리보기 자동 업데이트`);
                        console.log('Preview 업데이트:', value);
                    },
                    onChange: function(value, event) {
                        addLog('MessageInput.onChange', `변경 완료`);
                    }
                });

                // 3. ChipSelector 생성 및 연동
                chipSelector = GodoUIModule.render({
                    type: 'ChipSelector',
                    target: '#chip-selector-container',
                    title: '치환코드',
                    categories: categoriesData,
                    onSelect: function(variable, button) {
                        // ChipSelector에서 변수 선택 시 MessageInput에 삽입
                        // insertText가 자동으로 onInput 트리거 → Preview도 자동 업데이트
                        messageInput.insertText(variable);
                        addLog('ChipSelector → Input', `"${variable}" 삽입 → Preview 자동 반영`);
                    }
                });

                addLog('init', '✅ 완전 통합 초기화 완료 (Input ↔ Preview 실시간 연동)');
            } catch (error) {
                console.error('초기화 오류:', error);
                addLog('error', '❌ ' + error.message);
            }
        }

        // 템플릿 적용
        function applyTemplate() {
            const select = document.getElementById('templateSelect');
            const templateKey = select.value;
            
            if (!templateKey) return;

            const templateText = templates[templateKey];
            if (templateText) {
                messageInput.setValue(templateText);
                // setValue는 onInput을 트리거하지 않으므로 수동으로 Preview 업데이트
                crmPreview.setContent(templateText);
                addLog('applyTemplate', `"${select.options[select.selectedIndex].text}" 템플릿 적용 → Preview 업데이트`);
            }

            // 선택 초기화
            select.value = '';
        }

        // 발송 유형 변경
        function changeSendType() {
            const select = document.getElementById('sendTypeSelect');
            const sendType = select.value;
            
            switch (sendType) {
                case 'SMS':
                    messageInput.enableBytesMode({
                        maxLength: 2000,
                        bytesThreshold: 90
                    });
                    messageInput.setHint('SMS는 90 bytes 이하 권장, 최대 2000 bytes');
                    crmPreview.setSendType('SMS');
                    addLog('changeSendType', 'SMS 모드 (90 bytes 권장)');
                    break;
                    
                case 'LMS':
                    messageInput.enableBytesMode({
                        maxLength: 2000,
                        bytesThreshold: 0  // threshold 비활성화
                    });
                    messageInput.setHint('LMS는 최대 2000 bytes');
                    crmPreview.setSendType('SMS');  // LMS도 SMS 프리뷰 사용
                    addLog('changeSendType', 'LMS 모드 (최대 2000 bytes)');
                    break;
                    
                case 'NORMAL':
                    messageInput.enableCharMode({
                        maxLength: 1000
                    });
                    messageInput.setHint('일반 메시지 - 최대 1000자');
                    crmPreview.setSendType('SMS');
                    addLog('changeSendType', '일반 메시지 모드 (최대 1000자)');
                    break;
            }
        }

        // setValue 테스트
        function testSetValue() {
            const input = document.getElementById('setValueInput');
            const value = input.value.trim();
            
            if (!value) {
                alert('setValue할 내용을 입력해주세요.');
                return;
            }
            
            messageInput.setValue(value);
            // setValue는 onInput을 트리거하지 않으므로 수동으로 Preview 업데이트
            crmPreview.setContent(value);
            addLog('setValue', `직접 값 설정 (${value.length}자) → Preview 업데이트`);
            
            // 입력 필드 초기화
            input.value = '';
        }

        // getValue 테스트
        function testGetValue() {
            const value = messageInput.getValue();
            addLog('getValue', `현재 값 조회 (${value.length}자)`);
            alert(`현재 메시지:\n\n${value}\n\n길이: ${value.length}자`);
        }

        // clear 테스트
        function testClear() {
            if (confirm('작성한 메시지를 모두 지우시겠습니까?')) {
                messageInput.clear();
                crmPreview.setContent('');
                addLog('clear', '메시지 내용 초기화 → Preview도 초기화');
            }
        }

        // 로그 추가
        function addLog(event, message) {
            const logList = document.getElementById('log-list');
            const logItem = document.createElement('li');
            logItem.className = 'log-item';
            
            const now = new Date();
            const timeStr = now.toLocaleTimeString('ko-KR');
            
            logItem.innerHTML = `
                <span class="time">[${timeStr}]</span>
                <span class="event">${event}</span>
                <span class="message">${message}</span>
            `;
            
            logList.insertBefore(logItem, logList.firstChild);
            
            // 로그가 너무 많으면 오래된 것 삭제 (최대 30개)
            if (logList.children.length > 30) {
                logList.removeChild(logList.lastChild);
            }
        }

        // 로그 초기화
        function clearLog() {
            document.getElementById('log-list').innerHTML = '';
            addLog('clear', '로그 초기화');
        }

        // 페이지 로드 시 초기화
        // crm-preview-loader.js가 비동기로 로드하므로 이벤트 대기
        window.addEventListener('crmPreviewLoaded', function() {
            init();
        });
        
        // // 만약 이미 로드되었으면 바로 실행
        // window.addEventListener('DOMContentLoaded', function() {
        //     if (typeof CrmPreview !== 'undefined') {
        //         init();
        //     }
